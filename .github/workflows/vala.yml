name: GCC 15 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 26.04: libadwaita ≥ 1.6 (Adw.Spinner) и gcc 15 по умолчанию;
    # в образе ubuntu-24.04 libadwaita только 1.5
    container: ubuntu:26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install GCC, Vala and dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          gcc valac meson ninja-build pkg-config \
          libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
          libsqlite3-dev libxlsxwriter-dev
        cc --version

    - name: meson configure
      run: meson setup build

    - name: meson run build
      run: meson compile -C build

    - name: tests
      run: meson test -C build --print-errorlogs
